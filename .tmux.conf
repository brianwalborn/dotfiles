# allow click to switch panes
set -g mouse on

# copy highlighted text automatically
set -g mode-keys emacs
bind -T copy-mode MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

# key binds
bind / split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# status bar
# position
set -g status-position bottom

# general style
set -g status-style "bg=#2a2a3d,fg=#d4d4e0"
set -g status-left-length 40
set -g status-right-length 60

# left
set -g status-left "#[fg=#2a2a3d,bg=#a8d8ea,bold] #S #[default] "

# right
set -g status-right "#[fg=#b8b8c8]%a %b %d #[fg=#a8d8ea]%H:%M "

# window list
setw -g window-status-format "#[fg=#8888a0] #I:#W "
setw -g window-status-current-format "#[fg=#2a2a3d,bg=#f8c8dc,bold] #I:#W "

# pane borders
set -g pane-border-style "fg=#3a3a4d"
set -g pane-active-border-style "fg=#a8d8ea"

# message and command styling
set -g message-style "bg=#f8c8dc,fg=#2a2a3d"
set -g message-command-style "bg=#a8d8ea,fg=#2a2a3d"

# copy mode highlight
setw -g mode-style "bg=#c3b1e1,fg=#2a2a3d"
