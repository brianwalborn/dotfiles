# Only the settings that differ from kitty's defaults. Everything else is left
# unset so kitty upgrades pick up new defaults rather than fighting a vendored
# copy of the old ones.

# The Mono variant forces glyphs into a single cell, which keeps the .zprompt
# and nvim icons from bleeding into the character beside them. Drop the trailing
# "Mono" for wider, better-proportioned icons if you prefer them.
font_family JetBrainsMono Nerd Font Mono

# window
enabled_layouts grid
hide_window_decorations titlebar-and-corners
remember_window_position yes
window_padding_width 5

# colors
# themes/dark.conf is the baseline; theme.conf is a symlink into themes/ that the
# `light` and `dark` aliases repoint. globinclude rather than include so a machine
# that has never switched themes gets dark instead of a missing-file error.
# Nothing here should set a color directly, or it will win over the theme.
include themes/dark.conf
globinclude theme.conf

# tabs
# "custom" hands drawing to draw_tab() in tab_bar.py, which paints each tab a
# pastel rainbow color by position. It reads the active theme's background off
# kitty itself, so themes need no changes there.
tab_bar_style custom
tab_powerline_style slanted

# behavior
# socket-only remote control keeps the escape-code channel closed, so programs
# printing to the terminal cannot drive kitty; only things holding the socket
# path in $KITTY_LISTEN_ON can. That is what `kitty_theme` uses to reload.
allow_remote_control socket-only
editor nvim
listen_on unix:/tmp/kitty-{kitty_pid}
startup_session session.conf
