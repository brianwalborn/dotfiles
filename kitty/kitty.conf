# Only the settings that differ from kitty's defaults. Everything else is left
# unset so kitty upgrades pick up new defaults rather than fighting a vendored
# copy of the old ones.

# The Mono variant forces glyphs into a single cell, which keeps the .zprompt
# and nvim icons from bleeding into the character beside them. Drop the trailing
# "Mono" for wider, better-proportioned icons if you prefer them.
font_family JetBrainsMono Nerd Font Mono

# window
enabled_layouts grid
hide_window_decorations titlebar-and-corners
remember_window_position yes

# colors
active_border_color #2ECC71
background #18181C
foreground #ECF0F1
inactive_border_color #ECF0F1

# behavior
editor nvim
startup_session session.conf
