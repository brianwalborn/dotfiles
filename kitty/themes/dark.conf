# Dark theme. Only the colors that differ from kitty's defaults are set, so the
# ANSI palette stays whatever kitty ships. `kitty @ load-config` resets every
# unset option back to its default, which is what lets light.conf's fuller
# palette disappear cleanly when switching back here.

active_border_color   #2ECC71
background            #18181C
foreground            #ECF0F1
inactive_border_color #ECF0F1
