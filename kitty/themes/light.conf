# Light theme, tuned for direct sunlight: a white background and near-black
# text for maximum contrast. Unlike dark.conf this has to spell out the whole
# ANSI palette, because kitty's defaults assume a dark background (color15 is
# pure white, which is invisible here).

active_border_color   #1E8449
background            #FFFFFF
foreground            #1C1C21
inactive_border_color #A8ADB3

cursor                #1C1C21
cursor_text_color     #FFFFFF
selection_background  #B4D5FE
selection_foreground  #1C1C21
url_color             #0A5BB5

# normal
color0 #24292E
color1 #C0272D
color2 #157F3B
color3 #8B6100
color4 #0A5BB5
color5 #9A2FA8
color6 #0E7490
color7 #6A737D

# bright
color8  #4B5259
color9  #E03B41
color10 #1B9E4B
color11 #A87800
color12 #1170D6
color13 #B944C7
color14 #128DAE
color15 #1C1C21
